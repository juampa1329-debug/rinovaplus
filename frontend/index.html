<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f282c" />
    <script>
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("crm-cbn-appearance") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html {
        background: #f5f7f2;
      }
      html[data-theme="dark"] {
        background: #0f282c;
      }
    </style>
    <meta name="description" content="RinovaPlus, CRM inteligente de CBN." />
    <link rel="icon" type="image/svg+xml" href="/src/assets/rinovaplus.svg" />
    <title>RinovaPlus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
