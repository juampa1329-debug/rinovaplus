<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061225" />
    <script>
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("crm-cbn-appearance") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html {
        background: #f4f7fb;
      }
      html[data-theme="dark"] {
        background: #061225;
      }
    </style>
    <meta
      name="description"
      content="RinovaPlus. Clientes y conversaciones de la copia SQL local."
    />
    <title>RinovaPlus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
