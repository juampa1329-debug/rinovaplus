worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Docker's embedded DNS resolves the backend again after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 4178 default_server;
        server_name _;
        root /app/frontend;
        index workspace.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;

        location = /frontend-health {
            try_files /workspace.html =503;
        }

        # Initial account creation is restricted to the administrative flow.
        location = /api/institution/auth/bootstrap {
            return 404;
        }

        location ~ ^/(api/|hooks/|health/live$) {
            client_max_body_size 8m;
            set $backend ${CRM_BACKEND_URL};
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_read_timeout 125s;
        }

        location / {
            try_files $uri $uri/ /workspace.html;
        }
    }
}
