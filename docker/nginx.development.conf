worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_max_body_size 5700000;

    map $http_host $preview_host_allowed {
        default 0;
        "127.0.0.1:4173" 1;
        "localhost:4173" 1;
    }
    map $http_upgrade $frontend_connection {
        default upgrade;
        "" close;
    }

    server {
        listen 4174 default_server;
        server_name _;
        access_log off;
        error_log /dev/null;
        client_max_body_size 1000000;
        client_body_timeout 5s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;

        location = /api/v1/webhooks/meta {
            if ($request_method !~ "^(GET|POST)$") { return 405; }
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:8002";
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
        location / { return 404; }
    }

    server {
        listen 4173 default_server;
        server_name _;
        if ($preview_host_allowed = 0) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /api/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:8002";
            proxy_set_header Connection "";
            proxy_read_timeout 115s;
            proxy_send_timeout 115s;
        }
        location /health/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host "127.0.0.1:8002";
        }
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $frontend_connection;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
