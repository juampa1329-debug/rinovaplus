worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_max_body_size 5700000;

    # Validate the original browser Host before the loopback upstream rewrite.
    map $http_host $preview_host_allowed {
        default 0;
        "127.0.0.1:4173" 1;
        "localhost:4173" 1;
    }

    server {
        listen 4173 default_server;
        server_name _;
        if ($preview_host_allowed = 0) { return 403; }
        root /app/frontend;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /api/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:8002";
            proxy_set_header Connection "";
            # Origin and X-CRM-Local pass through unchanged; neither is synthesized.
            proxy_read_timeout 115s;
            proxy_send_timeout 115s;
        }

        location /health/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host "127.0.0.1:8002";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
