worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_max_body_size 512k;
    map $http_host $local_host_allowed {
        default 0;
        "127.0.0.1:4178" 1;
        "localhost:4178" 1;
    }
    server {
        listen 4178 default_server;
        server_name _;
        if ($local_host_allowed = 0) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        location ~ ^/api/v1/agents/profiles/[0-9a-fA-F-]+$ {
      client_max_body_size 8m;
      proxy_pass http://127.0.0.1:8004;
      proxy_set_header Host "127.0.0.1:8004";
      proxy_set_header Connection "";
      proxy_read_timeout 90s;
    }
        location = /api/v1/agents {
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }
        location /api/v1/agents/ {
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    location /hooks/ {
            client_max_body_size 1m;
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }
        location = /api/institution/campaigns/assets {
            client_max_body_size 7m;
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 90s;
        }
        location = /api/institution/media/upload {
            client_max_body_size 7m;
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }
        location ~ ^/api/institution/knowledge/(upload|records/[0-9a-fA-F-]+)$ {
            client_max_body_size 7m;
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 90s;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
            proxy_set_header Connection "";
            proxy_read_timeout 90s;
        }
        location /health/ {
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host "127.0.0.1:8004";
        }
        location / {
            root /app/institution-frontend;
            index workspace.html;
            try_files $uri $uri/ /workspace.html;
        }
    }
}

